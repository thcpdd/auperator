sources:
  python_app_logs:
    type: "docker_logs"
    include_containers: ["6a0964310ac3"] # 建议生产环境换成名称或 label

transforms:
  # 1. 鲁棒的合并逻辑：将多行堆栈聚合成一个事件
  merged_logs:
    type: "reduce"
    inputs: ["python_app_logs"]
    group_by: ["container_id"]
    merge_strategies:
      message: "concat"
    # 新行判断逻辑：让HTTP访问日志能与后续的错误堆栈合并
    # - 标准日志格式（2025-01-01、[INFO]、ERROR:等）触发新行
    # - 缩进行（4空格开头）、堆栈跟踪（Traceback、File、at ）不触发新行，会被合并
    # - 这样 HTTP: 172.18.0.1:38530 - "GET /api" 500 和后续的 Traceback 会合并在一起
    starts_when: |
      msg = to_string(.message) ?? ""

      # 缩进行和堆栈跟踪信息不触发新行
      is_continuation = match(msg, r'^(    |\t|at |File "|Traceback \(most|Caused by:|\[?WARNING|ERROR:|Exception:)')

      # 只有在不是延续行的情况下，才检查是否有标准日志前缀
      !is_continuation && match(msg, r'^(\d{4}-\d{2}-\d{2}|\[\d+\]|\d{2}:\d{2}:\d{2}|INFO|DEBUG|WARN|CRITICAL)')
    expire_after_ms: 1000

  # 2. 万能过滤逻辑：关键词+模式匹配
  # 过滤掉纯HTTP访问日志，只保留有实际错误信息的日志
  error_only_filter:
    type: "filter"
    inputs: ["merged_logs"]
    condition: |
      # 1. 安全转换并转为小写
      msg = downcase(to_string(.message) ?? "")

      # 2. 检测是否像HTTP访问日志
      # 格式: "IP:PORT - "METHOD PATH PROTO" STATUS"
      # 匹配标准HTTP访问日志格式，如: 172.18.0.1:38530 - "GET /api/stats HTTP/1.1" 500
      is_http_access = match(msg, r'\d+\.\d+\.\d+\.\d+:\d+ - "[A-Z]+ [^"]+?" \d{3}')

      # 3. 如果是HTTP访问日志，必须有更严重的错误信息
      http_has_real_error = is_http_access && match(msg, r'(traceback|exception|refused|connection|denied|timeout|error \(|caused by|failed)')

      # 4. 非HTTP访问日志，只要有错误关键词即可
      has_error_keyword = contains(msg, "error") ||
                           contains(msg, "exception") ||
                           contains(msg, "traceback") ||
                           contains(msg, "critical") ||
                           contains(msg, "fatal")

      # 5. 最终判断：非HTTP访问日志 OR HTTP访问日志但有实质错误
      (!is_http_access && has_error_keyword) || http_has_real_error

sinks:
  # HTTP sink - 发送到 Auperator API 进行日志聚合
  http_output:
    type: "http"
    inputs: ["error_only_filter"]
    uri: "http://127.0.0.1:7000/vector/ingest"
    encoding:
      codec: "json"
    batch:
      max_events: 10
      timeout_secs: 5
    request:
      timeout_secs: 10
      retry_attempts: 3
      retry_max_duration_secs: 30

  # 保留控制台输出用于调试
  console_output:
    type: "console"
    inputs: ["error_only_filter"]
    encoding:
      codec: "json"
